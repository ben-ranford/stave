name: prerelease-dry-run

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prerelease-dry-run-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_CURRENT: "1.27.1"

jobs:
  rolling:
    name: rolling / dry-run
    runs-on: stave-arc
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION_CURRENT }}
          cache: true
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: "22"
      - name: Install build tools
        run: |
          if ! command -v make >/dev/null 2>&1 || ! command -v rg >/dev/null 2>&1 || ! command -v gcc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y build-essential ripgrep
          fi
      - name: Run canonical CI
        env:
          CGO_ENABLED: "1"
        run: make ci
      - name: Compute rolling prerelease candidate
        run: make release-dry-run
