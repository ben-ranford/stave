name: prerelease-dry-run

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prerelease-dry-run-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_CURRENT: "1.26.5"

jobs:
  rolling:
    name: rolling / dry-run
    runs-on: stave-arc
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION_CURRENT }}
          cache: true
      - name: Run canonical CI
        run: make ci
      - name: Compute rolling prerelease candidate
        run: make release-dry-run
