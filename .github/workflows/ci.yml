name: ci

on:
  pull_request:
  push:
    tags-ignore:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_MINIMUM: "1.22.0"
  GO_VERSION_CURRENT: "1.27.1"

jobs:
  minimum:
    name: ci / go-minimum
    runs-on: stave-arc
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION_MINIMUM }}
          cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install build tools
        run: |
          packages=()
          command -v make >/dev/null 2>&1 || packages+=(make)
          command -v rg >/dev/null 2>&1 || packages+=(ripgrep)
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
      - name: Validate minimum floor
        run: make fmt-check vet suppression-check test coverage-threshold

  current:
    name: ci / go-current
    runs-on: stave-arc
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION_CURRENT }}
          cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install build tools
        run: |
          packages=()
          command -v make >/dev/null 2>&1 || packages+=(make)
          command -v rg >/dev/null 2>&1 || packages+=(ripgrep)
          command -v gcc >/dev/null 2>&1 || packages+=(gcc)
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
      - name: Run canonical verification
        env:
          CGO_ENABLED: "1"
        run: make verify

  security:
    name: ci / security
    runs-on: stave-arc
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION_CURRENT }}
          cache: true
      - name: Install build tools
        run: |
          packages=()
          command -v make >/dev/null 2>&1 || packages+=(make)
          command -v rg >/dev/null 2>&1 || packages+=(ripgrep)
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
      - name: Run security and dependency gates
        run: make dependency-inventory license-inventory govulncheck

  contracts:
    name: ci / contracts
    runs-on: stave-arc
    timeout-minutes: 20
    steps:
      - name: Verify repository merge policy with read-only token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { repository } = await github.graphql(`query MergePolicy($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                mergeCommitAllowed rebaseMergeAllowed squashMergeAllowed squashMergeCommitTitle
              }
            }`, { owner: context.repo.owner, repo: context.repo.repo });
            if (repository?.mergeCommitAllowed !== false || repository?.rebaseMergeAllowed !== false ||
                repository?.squashMergeAllowed !== true || repository?.squashMergeCommitTitle !== 'PR_TITLE') {
              throw new Error('Repository must allow only squash merges and use PR titles for squash commit titles.');
            }
            core.info('Read-only token verified the repository squash merge policy.');
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION_CURRENT }}
          cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install build tools
        run: |
          packages=()
          command -v make >/dev/null 2>&1 || packages+=(make)
          command -v rg >/dev/null 2>&1 || packages+=(ripgrep)
          command -v gcc >/dev/null 2>&1 || packages+=(gcc)
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
      - name: Run contract and workflow gates
        env:
          CGO_ENABLED: "1"
        run: make api-boundary schema-freshness adapters workflow-validate release-contract

  portability:
    name: ci / portability
    runs-on: stave-arc
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION_CURRENT }}
          cache: true
      - name: Verify cross-platform terminal capability fixtures
        run: go test ./capability -run 'TestCrossPlatformTerminalColourDetection|TestCapabilityProfileMatrix' -count=20
      - name: Cross-compile public packages
        run: |
          while IFS= read -r target; do
            export GOOS="${target%/*}"
            export GOARCH="${target#*/}"
            go build ./...
          done <<'TARGETS'
          linux/amd64
          darwin/amd64
          darwin/arm64
          windows/amd64
          TARGETS
