name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION_CURRENT: "1.26.5"

jobs:
  verify:
    name: release / verify
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: stave-arc
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION_CURRENT }}
          cache: true
      - name: Run release verification
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          channel="$(./scripts/rigor/check-release-tag.sh "${RELEASE_TAG}")"
          make ci
          if [[ "${channel}" == prerelease ]]; then
            make release-contract
          else
            make release-ga-contract
          fi
      - name: Upload performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stave-performance-evidence
          path: .artifacts/performance/report.json
          if-no-files-found: error

  publish:
    name: release / publish
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: verify
    runs-on: stave-arc
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Download performance evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stave-performance-evidence
          path: .artifacts/performance
      - name: Publish source release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.0.8
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            CHANGELOG.md
            LICENSE
            .artifacts/performance/report.json
