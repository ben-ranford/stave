name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION_CURRENT: "1.26.5"

jobs:
  verify:
    name: release / verify
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    outputs:
      channel: ${{ steps.release_tag.outputs.channel }}
    runs-on: stave-arc
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION_CURRENT }}
          cache: true
      - name: Install build tools
        run: |
          if ! command -v make >/dev/null 2>&1 || ! command -v rg >/dev/null 2>&1 || ! command -v gcc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y build-essential ripgrep
          fi
      - name: Validate release tag
        id: release_tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          channel="$(./scripts/rigor/check-release-tag.sh "${RELEASE_TAG}")"
          printf 'channel=%s\n' "${channel}" >> "${GITHUB_OUTPUT}"
      - name: Run release verification
        env:
          CGO_ENABLED: "1"
          RELEASE_CHANNEL: ${{ steps.release_tag.outputs.channel }}
        run: |
          make ci
          if [[ "${RELEASE_CHANNEL}" == prerelease ]]; then
            make release-contract
          else
            make release-ga-contract
          fi
      - name: Upload performance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stave-performance-evidence
          path: .artifacts/performance/report.json
          if-no-files-found: error

  publish:
    name: release / publish
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: verify
    runs-on: stave-arc
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download performance evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stave-performance-evidence
          path: .artifacts/performance
      - name: Publish source release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.verify.outputs.channel == 'prerelease' }}
          files: |
            CHANGELOG.md
            LICENSE
            .artifacts/performance/report.json
