name: Bug report
description: Report a defect in the Stave library, examples, or repo automation.
title: "[bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and the user-visible impact.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include a release tag, branch, or commit SHA.
      placeholder: v0.1.0 or a1b2c3d
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
      placeholder: go version go1.26.5 darwin/arm64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide commands, code, or fixtures that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation evidence
      description: Paste `make fast`, `make verify`, or focused command output if available.
